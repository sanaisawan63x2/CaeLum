name: Merge novel data

on:
  push:
    branches: [main]
    paths:
      - "data/novel/arc1/**"
      - "scripts/merge-novel.mjs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/merge-novel.mjs
      - name: Commit merged novel
        run: |
          if git diff --quiet -- data/world.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/world.json
          git commit -m "Merge Arc 1 novel data"
          git push
