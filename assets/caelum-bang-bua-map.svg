<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">ผังตั้งต้น CaeLum และสถานีบางบัว</title>
<desc id="desc">CaeLum อยู่ฝั่งตรงข้ามถนนจากสถานีบางบัว รถไฟฟ้าวิ่งบนรางยกระดับเหนือถนน บันไดลงจากสถานีสู่ทางเท้าและทางข้ามไปยังประตูหลัก</desc>
<defs>
  <pattern id="road" width="42" height="42" patternUnits="userSpaceOnUse" patternTransform="rotate(90)">
    <rect width="42" height="42" fill="#26333b"/>
    <path d="M21 0v20" stroke="#e7d9a5" stroke-width="3" stroke-dasharray="12 10"/>
  </pattern>
  <pattern id="crossing" width="24" height="24" patternUnits="userSpaceOnUse">
    <rect width="24" height="24" fill="#f8f6ef"/>
    <rect width="11" height="24" fill="#d7d9d3"/>
  </pattern>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
    <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#24303a" flood-opacity=".12"/>
  </filter>
</defs>
<rect width="1200" height="720" fill="#f5f3ed"/>
<text x="58" y="53" fill="#25333b" font-family="sans-serif" font-size="25" font-weight="700">ผังตำแหน่งตั้งต้น · CaeLum / Bang Bua</text>
<text x="58" y="80" fill="#6c7777" font-family="sans-serif" font-size="14">ความสัมพันธ์ของสถานี ถนน และทางเข้ามหาวิทยาลัย · ภาพไม่กำหนดสเกล</text>

<rect x="58" y="112" width="560" height="292" rx="26" fill="#e5ecdf" stroke="#b9c9b5" stroke-width="2" filter="url(#shadow)"/>
<text x="88" y="154" fill="#415748" font-family="sans-serif" font-size="20" font-weight="700">พื้นที่ภายใน CaeLum</text>
<text x="88" y="180" fill="#68786a" font-family="sans-serif" font-size="13">ตำแหน่งอาคารอื่นยังปรับได้</text>
<rect x="105" y="218" width="172" height="88" rx="14" fill="#f6f5ef" stroke="#c8d0c2"/>
<text x="191" y="256" text-anchor="middle" fill="#5d6b60" font-family="sans-serif" font-size="14">กลุ่มอาคาร</text>
<text x="191" y="279" text-anchor="middle" fill="#879287" font-family="sans-serif" font-size="11">ตำแหน่งร่าง</text>
<rect x="330" y="218" width="172" height="88" rx="14" fill="#f6f5ef" stroke="#c8d0c2"/>
<text x="416" y="256" text-anchor="middle" fill="#5d6b60" font-family="sans-serif" font-size="14">พื้นที่ส่วนกลาง</text>
<text x="416" y="279" text-anchor="middle" fill="#879287" font-family="sans-serif" font-size="11">ตำแหน่งร่าง</text>
<path d="M75 374H600" stroke="#aabda8" stroke-width="3"/>
<text x="342" y="366" text-anchor="middle" fill="#718071" font-family="sans-serif" font-size="11">แนวพื้นที่มหาวิทยาลัย</text>
<rect x="493" y="348" width="126" height="57" rx="10" fill="#344b41"/>
<path d="M511 405v-34a45 45 0 0 1 90 0v34" fill="#f5f3ed" stroke="#cfb77a" stroke-width="5"/>
<text x="556" y="393" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="13" font-weight="700">ประตูหลัก</text>

<text x="883" y="139" text-anchor="middle" fill="#526269" font-family="sans-serif" font-size="13" font-weight="700">รางรถไฟฟ้ายกระดับเหนือถนน</text>
<rect x="628" y="154" width="508" height="45" rx="14" fill="#30444e" filter="url(#shadow)"/>
<rect x="650" y="166" width="465" height="6" rx="3" fill="#93a4a8"/>
<rect x="650" y="183" width="465" height="5" rx="2.5" fill="#c6d0ce"/>
<rect x="713" y="211" width="310" height="89" rx="16" fill="#fffdf8" stroke="#c9cfc8" stroke-width="2" filter="url(#shadow)"/>
<rect x="713" y="211" width="310" height="27" rx="16" fill="#a98242"/>
<path d="M713 228h310" stroke="#a98242" stroke-width="22"/>
<text x="868" y="230" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="12" font-weight="700">สถานีรถไฟฟ้า</text>
<text x="868" y="270" text-anchor="middle" fill="#293a41" font-family="sans-serif" font-size="22" font-weight="700">บางบัว · Bang Bua</text>
<text x="868" y="289" text-anchor="middle" fill="#7b8580" font-family="sans-serif" font-size="11">ชานชาลาอยู่เหนือถนน</text>

<path d="M746 299l-100 118-65 35" fill="none" stroke="#66777b" stroke-width="13" stroke-linecap="round"/>
<path d="M746 299l-100 118-65 35" fill="none" stroke="#e5e9e4" stroke-width="3" stroke-dasharray="7 8"/>
<text x="692" y="363" fill="#53656a" font-family="sans-serif" font-size="12">บันไดลง</text>

<rect x="0" y="474" width="1200" height="34" fill="#d5d4cc"/>
<text x="68" y="497" fill="#56646a" font-family="sans-serif" font-size="12">ทางเท้า</text>
<path d="M581 452H553V466" fill="none" stroke="#b9954d" stroke-width="4" stroke-dasharray="8 7"/>
<path d="M541 458l12 12 12-12" fill="#b9954d"/>
<text x="593" y="457" fill="#8b713c" font-family="sans-serif" font-size="12">เดินตามทางเท้าไปทางข้าม</text>
<rect x="0" y="508" width="1200" height="164" fill="url(#road)"/>
<rect x="522" y="508" width="64" height="164" fill="url(#crossing)" opacity=".95"/>
<text x="63" y="557" fill="#f5f3ed" font-family="sans-serif" font-size="19" font-weight="700">ถนนหน้า CaeLum</text>
<text x="63" y="584" fill="#c4ccca" font-family="sans-serif" font-size="12">รถสัญจรอยู่ใต้แนวรางยกระดับ</text>
<path d="M554 510V435" stroke="#b9954d" stroke-width="4" stroke-dasharray="8 7"/>
<path d="M542 447l12-15 12 15" fill="#b9954d"/>
<text x="573" y="531" fill="#fffdf8" font-family="sans-serif" font-size="12">ทางข้าม</text>
<text x="756" y="696" fill="#68746e" font-family="sans-serif" font-size="12">ร้านค้าและผังฝั่งตรงข้ามยังไม่ล็อก</text>
</svg>