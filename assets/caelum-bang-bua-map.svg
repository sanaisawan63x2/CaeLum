<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">ผังตั้งต้น CaeLum และสถานีบางบัว</title>
<desc id="desc">แผนภาพแสดงมหาวิทยาลัย CaeLum อยู่ฝั่งหนึ่งของถนน สถานีรถไฟฟ้าบางบัวอยู่บนรางยกระดับเหนือถนน มีบันไดลงสู่ทางเท้าและทางข้ามไปยังประตูหลัก</desc>
<defs>
  <pattern id="road" width="42" height="42" patternUnits="userSpaceOnUse" patternTransform="rotate(90)">
    <rect width="42" height="42" fill="#26333b"/>
    <path d="M21 0v20" stroke="#e7d9a5" stroke-width="3" stroke-dasharray="12 10"/>
  </pattern>
  <pattern id="crossing" width="24" height="24" patternUnits="userSpaceOnUse">
    <rect width="24" height="24" fill="#f8f6ef"/>
    <rect width="11" height="24" fill="#d7d9d3"/>
  </pattern>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
    <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#24303a" flood-opacity=".12"/>
  </filter>
</defs>
<rect width="1200" height="720" fill="#f5f3ed"/>
<text x="58" y="53" fill="#25333b" font-family="sans-serif" font-size="25" font-weight="700">ผังตำแหน่งตั้งต้น · CaeLum / Bang Bua</text>
<text x="58" y="80" fill="#6c7777" font-family="sans-serif" font-size="14">แผนภาพเพื่อกำหนดความสัมพันธ์ของทางเข้าและระบบขนส่ง · ยังไม่กำหนดสเกล</text>

<!-- Campus interior: areas beyond the entrance remain open for later mapping -->
<rect x="58" y="112" width="515" height="290" rx="26" fill="#e5ecdf" stroke="#b9c9b5" stroke-width="2" filter="url(#shadow)"/>
<text x="88" y="154" fill="#415748" font-family="sans-serif" font-size="20" font-weight="700">พื้นที่ภายใน CaeLum</text>
<text x="88" y="180" fill="#68786a" font-family="sans-serif" font-size="13">อาคารและจุดหมายภายในจะเติมรายละเอียดภายหลัง</text>
<rect x="110" y="218" width="156" height="94" rx="14" fill="#f6f5ef" stroke="#c8d0c2"/>
<text x="188" y="260" text-anchor="middle" fill="#5d6b60" font-family="sans-serif" font-size="14">กลุ่มอาคาร</text>
<text x="188" y="282" text-anchor="middle" fill="#879287" font-family="sans-serif" font-size="11">ตำแหน่งร่าง</text>
<rect x="365" y="218" width="156" height="94" rx="14" fill="#f6f5ef" stroke="#c8d0c2"/>
<text x="443" y="260" text-anchor="middle" fill="#5d6b60" font-family="sans-serif" font-size="14">พื้นที่ส่วนกลาง</text>
<text x="443" y="282" text-anchor="middle" fill="#879287" font-family="sans-serif" font-size="11">ตำแหน่งร่าง</text>
<path d="M76 375H556" stroke="#aabda8" stroke-width="3"/>
<text x="316" y="366" text-anchor="middle" fill="#718071" font-family="sans-serif" font-size="11">แนวพื้นที่มหาวิทยาลัย</text>

<!-- Main gate and road crossing -->
<rect x="493" y="346" width="118" height="57" rx="10" fill="#344b41"/>
<path d="M511 403v-33a41 41 0 0 1 82 0v33" fill="#f5f3ed" stroke="#cfb77a" stroke-width="5"/>
<text x="552" y="392" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="13" font-weight="700">ประตูหลัก</text>
<path d="M552 405v205" fill="none" stroke="#b9954d" stroke-width="4" stroke-dasharray="9 8"/>
<path d="M540 585l12 18 12-18" fill="#b9954d"/>
<text x="565" y="474" fill="#8b713c" font-family="sans-serif" font-size="12">ข้ามถนน</text>

<!-- Elevated railway and station -->
<rect x="620" y="154" width="522" height="54" rx="14" fill="#30444e" filter="url(#shadow)"/>
<rect x="641" y="167" width="480" height="7" rx="3.5" fill="#93a4a8"/>
<rect x="641" y="187" width="480" height="5" rx="2.5" fill="#c6d0ce"/>
<text x="875" y="144" text-anchor="middle" fill="#526269" font-family="sans-serif" font-size="13" font-weight="700">รางรถไฟฟ้ายกระดับ</text>
<rect x="770" y="215" width="286" height="90" rx="16" fill="#fffdf8" stroke="#c9cfc8" stroke-width="2" filter="url(#shadow)"/>
<rect x="770" y="215" width="286" height="27" rx="16" fill="#a98242"/>
<path d="M770 232h286" stroke="#a98242" stroke-width="22"/>
<text x="913" y="234" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="12" font-weight="700">สถานีรถไฟฟ้า</text>
<text x="913" y="276" text-anchor="middle" fill="#293a41" font-family="sans-serif" font-size="22" font-weight="700">บางบัว · Bang Bua</text>
<text x="913" y="294" text-anchor="middle" fill="#7b8580" font-family="sans-serif" font-size="11">ชานชาลาอยู่เหนือถนน</text>
<path d="M1064 302l-72 96-20 21" fill="none" stroke="#66777b" stroke-width="13" stroke-linecap="round"/>
<path d="M1064 302l-72 96-20 21" fill="none" stroke="#e5e9e4" stroke-width="3" stroke-dasharray="7 8"/>
<text x="1059" y="360" fill="#53656a" font-family="sans-serif" font-size="12">บันไดลง</text>
<path d="M964 420h-45" stroke="#b9954d" stroke-width="4" stroke-dasharray="7 6"/>
<circle cx="916" cy="420" r="7" fill="#b9954d"/>
<text x="923" y="445" fill="#8b713c" font-family="sans-serif" font-size="12">ทางเท้า</text>

<!-- Road frontage -->
<rect x="0" y="486" width="1200" height="29" fill="#d5d4cc"/>
<text x="60" y="505" fill="#56646a" font-family="sans-serif" font-size="12">ทางเท้าหน้ามหาวิทยาลัย</text>
<rect x="0" y="516" width="1200" height="156" fill="url(#road)"/>
<text x="63" y="564" fill="#f5f3ed" font-family="sans-serif" font-size="19" font-weight="700">ถนนหน้า CaeLum</text>
<text x="63" y="590" fill="#c4ccca" font-family="sans-serif" font-size="12">การสัญจรของเมืองอยู่ใต้แนวรางยกระดับ</text>
<rect x="520" y="516" width="64" height="156" fill="url(#crossing)" opacity=".92"/>
<rect x="1042" y="516" width="64" height="156" fill="url(#crossing)" opacity=".92"/>
<text x="580" y="694" fill="#68746e" font-family="sans-serif" font-size="12">ตำแหน่งร้านค้าและพื้นที่ฝั่งตรงข้ามยังไม่ล็อก</text>
</svg>